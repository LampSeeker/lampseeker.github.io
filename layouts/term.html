{{ define "main" }}
  <article class="notion-page notion-term">
    <header class="notion-page-header notion-page-header-no-cover">
      <h1 class="notion-term-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.4 3.75H6.75A2.25 2.25 0 0 0 4.5 6v4.65c0 .6.24 1.17.66 1.59l7.1 7.1a2.25 2.25 0 0 0 3.18 0l3.9-3.9a2.25 2.25 0 0 0 0-3.18l-7.1-7.1a2.25 2.25 0 0 0-1.59-.66Zm-2.9 4.5a1.1 1.1 0 1 1 2.2 0 1.1 1.1 0 0 1-2.2 0Z"/></svg>
        {{ .Title }} <small>{{ len .Pages }}</small>
      </h1>
    </header>
    <div class="notion-page-body">
      <ul class="notion-term-list">
        {{ range .Pages.ByDate.Reverse }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <span></span>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "docs/date" (dict "Date" .Date "Format" $.Site.Params.BookDateFormat) }}</time>
          </li>
        {{ end }}
      </ul>
    </div>
  </article>
{{ end }}

{{ define "toc-container" }}{{ end }}
